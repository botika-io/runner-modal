[project]
name = "runner-modal"
version = "0.1.0"
description = "GitHub Actions self-hosted runners on Modal Sandboxes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["modal", "github-actions", "ci", "runners", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "modal>=1.6.0,<2",
    "pydantic>=2.0",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.urls]
Homepage = "https://github.com/modal-projects/runner-modal"
Repository = "https://github.com/modal-projects/runner-modal"
Issues = "https://github.com/modal-projects/runner-modal/issues"


[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.21",
    "ty>=0.0.62",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src/runner_modal", "examples", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["runner_modal"]
