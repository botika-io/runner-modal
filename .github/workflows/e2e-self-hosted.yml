name: E2E self-hosted

on:
  push:
    branches: [e2e-dogfood]
  workflow_dispatch:

concurrency:
  group: e2e-self-hosted
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on:
      - self-hosted
      - modal
      - acme
      - job-${{ github.run_id }}-${{ github.job }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Hello from Modal runner
        run: |
          echo "ok repo=$GITHUB_REPOSITORY runner=$RUNNER_NAME"
          uname -a
          python3 --version || true
